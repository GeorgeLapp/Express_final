<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>
    <div class="container">
        <header class="header">
            <button class="back-button">
                <img src="./images/back button.png" alt="Back Icon" />
            </button>
            <img class="logo" src="./images/express1-logo.png" alt="Express1 Logo">
        </header>
        <div class="main-content wallet-content">
            <main class="wallet-panel">
                <div class="wallet-balance-label">Доступно экспрессов</div>
                <div class="wallet-balance-value" id="attemptsValue">0</div>
                <div class="wallet-package-label">Выберите тариф</div>

                <div class="wallet-plans">
                    <article class="wallet-plan-card">
                        <div class="wallet-plan-title">100 экспрессов</div>
                        <div class="wallet-plan-price">500 ₽</div>
                        <button class="guru-btn wallet-buy-button" data-plan-key="express_100" disabled>Купить</button>
                    </article>

                    <article class="wallet-plan-card">
                        <div class="wallet-plan-title">Неделя</div>
                        <div class="wallet-plan-price">1 000 ₽</div>
                        <div class="wallet-plan-note">Без ограничений или до 1000 экспрессов</div>
                        <button class="guru-btn wallet-buy-button" data-plan-key="week" disabled>Купить</button>
                    </article>

                    <article class="wallet-plan-card">
                        <div class="wallet-plan-title">Месяц</div>
                        <div class="wallet-plan-price">5 000 ₽</div>
                        <button class="guru-btn wallet-buy-button" data-plan-key="month" disabled>Купить</button>
                    </article>

                    <article class="wallet-plan-card">
                        <div class="wallet-plan-title">Год</div>
                        <div class="wallet-plan-price">25 000 ₽</div>
                        <button class="guru-btn wallet-buy-button" data-plan-key="year" disabled>Купить</button>
                    </article>
                </div>

                <p class="wallet-status" id="walletStatus"></p>
            </main>
        </div>
        <footer class="footer">
            <button class="footer-icon" data-page="wallet">
                <img src="./images/icon-dollar.png" alt="Dollar Icon" />
            </button>
            <button class="footer-icon" data-page="history">
                <img src="./images/icon-graph.png" alt="Graph Icon" />
            </button>
            <button class="footer-icon" data-page="instruction">
                <img src="./images/icon-question.png" alt="Question Icon" />
            </button>
            <button class="footer-icon" data-page="profile">
                <img src="./images/icon-user.png" alt="User Icon" />
            </button>
        </footer>
    </div>
    <script src="./js/wallet-screen.js" type="module"></script>
</body>

</html>

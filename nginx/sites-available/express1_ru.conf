# HTTP to HTTPS redirect
server {
    listen 147.78.67.179:80;
    server_name express1.ru www.express1.ru; # Укажите ваши домены

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 147.78.67.179:443 ssl http2;
    server_name express1.ru www.express1.ru;

    # Пути к SSL-сертификату и ключу
    ssl_certificate /etc/ssl/certs/express1_ru.full.crt;
    ssl_certificate_key /etc/ssl/private/express1_ru.key;

    # Настройки SSL
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;

    # Корневая директория (при необходимости)
    #root /var/www/html;
    #index index.html;

    # Запрещаем кэширование для HTML, JS и CSS
    #location ~* \.(html|htm|js|css)$ {
    #    # Полностью отключаем кэш
    #    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    #
    #    # Для старых браузеров/прокси
    #    add_header Pragma "no-cache";
    #    add_header Expires "0";
    #}

    # ==========================================================
    # IMPORTANT: Billing + T-Bank routes MUST be above "/"
    # Front is only on localhost:3000, Billing service on :3010
    # ==========================================================

    # Billing API prefix -> billing-service (localhost:3010)
    location ^~ /api/billing/ {
        proxy_pass http://localhost:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # T-Bank notification and redirects -> billing-service (localhost:3010)
    location = /api/tbank/notification {
        client_max_body_size 1m;

        proxy_pass http://localhost:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/tbank/success {
        proxy_pass http://localhost:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/tbank/fail {
        proxy_pass http://localhost:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Robokassa is intentionally disabled for now.
    location = /api/robokassa/result {
        return 410;
    }

    location = /api/robokassa/success {
        return 410;
    }

    location = /api/robokassa/fail {
        return 410;
    }

    # Standalone static frontend (isolated from the main Express1 app)
    location = /trc_golden_frontend {
        return 301 /trc_golden_frontend/;
    }

    location ^~ /trc_golden_frontend/ {
        alias /var/www/trc_golden_frontend/;
        index index.html;
        try_files $uri $uri/ /trc_golden_frontend/index.html;
    }

    # Проксирование на фронт (localhost:3000)
    location / {
        # --- ОТКЛЮЧАЕМ СЖАТИЕ ---
        # Это обязательно, иначе sub_filter не сможет прочитать файл!
        #gzip off;

        # Отключаем кэширование
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        expires -1;

        # Настраиваем подмену
        #sub_filter_types text/html;
        #sub_filter '.js"' '.js?v=$msec"';  # Для двойных кавычек
        #sub_filter ".js'" ".js?v=$msec'";  # Добавил для ОДИНАРНЫХ кавычек (на всякий случай)
        #sub_filter '.css"' '.css?v=$msec"';
        #sub_filter ".css'" ".css?v=$msec'";
        #sub_filter_once off;

        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Проксирование на основной backend (localhost:3001)
    location /backend/ {
        proxy_pass http://localhost:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Дополнительные настройки
    error_log /var/log/nginx/express1_ru_error.log;
    access_log /var/log/nginx/express1_ru_access.log;
}

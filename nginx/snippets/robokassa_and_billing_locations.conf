# ============================================
# Billing service upstream routing
# ============================================

# T-Bank callbacks/redirects must go to BILLING (not front).

location = /api/tbank/notification {
    client_max_body_size 1m;

    proxy_pass http://127.0.0.1:3010;
    include /etc/nginx/snippets/proxy_headers.conf;
}

location = /api/tbank/success {
    proxy_pass http://127.0.0.1:3010;
    include /etc/nginx/snippets/proxy_headers.conf;
}

location = /api/tbank/fail {
    proxy_pass http://127.0.0.1:3010;
    include /etc/nginx/snippets/proxy_headers.conf;
}

# Robokassa is intentionally disabled (merchant is not active yet).
location = /api/robokassa/result {
    return 410;
}

location = /api/robokassa/success {
    return 410;
}

location = /api/robokassa/fail {
    return 410;
}

# Route billing API under a prefix to avoid conflicts with front routes.
location ^~ /api/billing/ {
    proxy_pass http://127.0.0.1:3010;
    include /etc/nginx/snippets/proxy_headers.conf;
}
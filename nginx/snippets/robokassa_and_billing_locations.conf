# ============================================
# Billing service upstream routing
# ============================================

# Robokassa callbacks/redirects must go to BILLING (not front).
# ResultURL is server-to-server proof. Success/Fail are user redirects.

location = /api/robokassa/result {
    # Robokassa usually sends application/x-www-form-urlencoded
    client_max_body_size 1m;

    proxy_pass http://127.0.0.1:3010;
    include /etc/nginx/snippets/proxy_headers.conf;
}

location = /api/robokassa/success {
    proxy_pass http://127.0.0.1:3010;
    include /etc/nginx/snippets/proxy_headers.conf;
}

location = /api/robokassa/fail {
    proxy_pass http://127.0.0.1:3010;
    include /etc/nginx/snippets/proxy_headers.conf;
}

# Optional (recommended): route all billing API under a prefix
# so it never conflicts with front routes.
# Example: your billing endpoints become:
#   POST /api/billing/checkout/create
#   GET  /api/billing/products
# etc.
#
# If you DON'T want a prefix and want billing API to live in /api/*,
# then replace ^~ /api/billing/ with ^~ /api/ BUT be careful:
# it might conflict with front's own /api routes if any.
location ^~ /api/billing/ {
    proxy_pass http://127.0.0.1:3010;
    include /etc/nginx/snippets/proxy_headers.conf;
}
